databases:
  - name: mindbridge-db
    databaseName: mindbridge_wqup
    user: mindbridge_user
    plan: free
    region: oregon

services:
  - type: web
    name: mindbridge-campus
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mindbridge-db
          property: connectionString
      - key: PROJECT_NAME
        value: "MindBridge Campus"
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
