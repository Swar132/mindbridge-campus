databases:
  - name: mindbridge-db
    databaseName: mindbridge
    user: mindbridge_user
    plan: free
    region: oregon

services:
  - type: web
    name: mindbridge-campus
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PROJECT_NAME
        value: "MindBridge Campus"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mindbridge-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
