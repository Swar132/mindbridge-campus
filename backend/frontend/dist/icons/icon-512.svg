<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.95" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base with Soft Liquid Glow -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Subtle Liquid Inner Reflection -->
  <rect x="28" y="28" width="456" height="230" rx="124" fill="white" fill-opacity="0.15" />

  <!-- MindBridge Calming Vector Emblem (Bridge + Heart + Zen Waves) -->
  <g transform="translate(106, 110)">
    <!-- Bridge Arch -->
    <path d="M 20 220 C 50 120, 250 120, 280 220" stroke="url(#glowGrad)" stroke-width="24" stroke-linecap="round" fill="none" />
    <!-- Floating Mind Heart / Lotus Leaf -->
    <path d="M 150 70 C 130 30, 70 30, 70 90 C 70 140, 150 190, 150 200 C 150 190, 230 140, 230 90 C 230 30, 170 30, 150 70 Z" fill="white" />
    <!-- Mind Sparkle Stars -->
    <circle cx="50" cy="80" r="12" fill="#FED7AA" />
    <circle cx="250" cy="70" r="14" fill="#FED7AA" />
    <circle cx="270" cy="140" r="8" fill="#FFFFFF" fill-opacity="0.8" />
  </g>
</svg>
